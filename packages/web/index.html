<html lang="pl">

  <!-- SEO Meta Tags - Will be replaced by server for specific pages -->
  <title>{{PAGE_TITLE}}</title>
  <meta name="title" content="{{PAGE_TITLE}}" />
  <meta name="description" content="{{PAGE_DESCRIPTION}}" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

<body>
  <noscript>
    <strong>App requires JavaScript to run</strong>

  <div id="app">
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <div id="preloader" style="position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999;">
      <div style="text-align: center;">
        <div style="width: 60px; height: 60px; border: 3px solid rgba(255, 107, 107, 0.2); border-top-color: #FF6B6B; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
