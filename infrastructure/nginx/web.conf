# PlayAnime web — nginx.
#
# Serves the static bundle and proxies /api to the API container, so the browser
# sees one origin. That is what makes the session cookie first-party and lets
# SameSite=Lax do its job; splitting the two across origins would require
# SameSite=None and reintroduce the CSRF surface the cookie policy closes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Errors of ours, not nginx's default pages, which leak the version.
    server_tokens off;

    # --- Security headers ----------------------------------------------------
    #
    # The app's CSP is stricter than the API's because this document actually
    # executes script and frames third-party players.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # frame-src lists exactly the providers PlayAnime may embed. It is derived
    # from ProviderRegistry.frameSrcOrigins() — regenerate this when the
    # provider allowlist changes, or an approved provider will be blocked and a
    # removed one will still load.
    #
    # frame-ancestors 'none' stops PlayAnime itself being framed, which is the
    # clickjacking defence.
    add_header Content-Security-Policy "\
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data: https:; \
media-src 'self' https:; \
connect-src 'self'; \
frame-src https://www.youtube-nocookie.com https://www.youtube.com https://drive.google.com https://rumble.com; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'" always;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Static assets -------------------------------------------------------
    #
    # Vite fingerprints filenames, so hashed assets are immutable and can be
    # cached indefinitely. The HTML entry must never be, or a deploy would not
    # reach returning visitors.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- API proxy -----------------------------------------------------------
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API reads the rightmost TRUST_PROXY_HOPS entries, so appending
        # here is what makes rate limiting see the real client rather than a
        # value the caller chose.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Responses carry Set-Cookie and vary by session; caching them would
        # serve one user's session to another.
        proxy_buffering off;
    }

    # --- WebSocket -----------------------------------------------------------
    location /ws {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Watch parties idle between playback events; the default 60s timeout
        # would drop a paused room.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- SPA fallback --------------------------------------------------------
    #
    # Last, so it cannot shadow the routes above. Any unmatched path returns the
    # entry document and the client router resolves it — which is how a deep
    # link like /anime/steins-gate works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
