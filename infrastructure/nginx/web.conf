# PlayAnime web — nginx.
#
# Serves the static bundle and proxies /api to the API container, so the browser
# sees one origin. That is what makes the session cookie first-party and lets
# SameSite=Lax do its job; splitting the two across origins would require
# SameSite=None and reintroduce the CSRF surface the cookie policy closes.
#
# Functional parity with services/webserver (the Go alternative to this
# config): same cache policy on hashed assets, same security headers, same
# staff-only gate on .map files. That server additionally injects per-route
# OG/meta tags for crawlers — this config can't do that, so pick it over the
# Go server only when crawler-facing OG tags don't matter for your deployment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Errors of ours, not nginx's default pages, which leak the version.
    server_tokens off;

    # Docker's embedded DNS. A bare `proxy_pass http://api:4000` resolves
    # "api" once, at config load, and nginx refuses to start at all if that
    # lookup fails — compose's healthcheck condition (see docker-compose.yml)
    # covers first boot, but not the API container being recreated later
    # (a redeploy, a restart) while this one keeps running. Routing proxy_pass
    # through a variable (below) makes nginx re-resolve per request instead.
    resolver 127.0.0.11 valid=30s;

    # --- Security headers ------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mirrors middleware/security.go's default CSP (services/webserver) so both
    # front doors present the same policy to the browser.
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http://localhost:* http://127.0.0.1:* https://playani.me https://*.playani.me; worker-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https: http: http://localhost:* http://127.0.0.1:* https://playani.me; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; font-src 'self' data: https:; media-src 'self' blob: data: https: http://localhost:* http://127.0.0.1:* https://playani.me https://*.playani.me; connect-src 'self' https: http: http://localhost:* http://127.0.0.1:* ws://localhost:* wss://*;" always;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API proxy -----------------------------------------------------------
    location /api/ {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API reads the rightmost TRUST_PROXY_HOPS entries, so appending
        # here is what makes rate limiting see the real client rather than a
        # value the caller chose.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Responses carry Set-Cookie and vary by session; caching them would
        # serve one user's session to another.
        proxy_buffering off;
    }

    # --- WebSocket -----------------------------------------------------------
    location /ws {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Watch parties idle between playback events; the default 60s timeout
        # would drop a paused room.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Source maps (staff only) ----------------------------------------------
    #
    # Vite emits sourcemap: true, so every /js/*.js and /assets/*.css ships a
    # sibling .map. nginx has no session-verification path of its own — unlike
    # services/webserver's AdminOnly middleware, which calls back to
    # GET /api/v1/auth/me — so this config can only choose between "public" and
    # "off". Off is the safer default for a plain nginx deployment; switch to
    # the Go server (services/webserver, ENABLE_SOURCE_MAPS=true) for gated
    # staff access instead of loosening this.
    location ~ \.map$ {
        return 404;
    }

    # --- Hashed build assets (long-lived, immutable cache) ----------------------
    #
    # vite.config.ts names every JS/CSS output [hash:16].ext, so a changed file
    # is a changed URL — safe to cache forever. Mirrors the Cache-Control values
    # in middleware/static.go (services/webserver).
    location ^~ /js/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Legal documents (packages/web/public/legal) ----------------------------
    #
    # Vite copies public/ verbatim into dist/, so these are real files at
    # /legal/<page>_<lang>.md — the frontend's /legal/[page].vue fetches them
    # client-side. Matched ahead of the SPA fallback so the raw markdown is
    # served instead of index.html; any path here that isn't an actual file
    # (e.g. /legal/tos, the page route itself) falls through to try_files'
    # /index.html default, same outcome as services/webserver's
    # ServeLegalDocument choosing by filename shape.
    location ^~ /legal/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri /index.html;
    }

    location = /favicon.ico {
        access_log off;
    }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
    }

    # --- SPA fallback --------------------------------------------------------
    #
    # Last, so it cannot shadow the routes above. Any unmatched path returns the
    # entry document and the client router resolves it — which is how a deep
    # link like /anime/steins-gate works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
