# Production overlay for a single VPS. Applied on top of the root
# docker-compose.yml, not a replacement for it — the base file still owns
# every service's build/image/healthcheck; this only changes what
# production needs different from the shared dev defaults:
#
#   - Redis no longer publishes to the host at all (nothing outside the
#     compose network needs it directly).
#   - Postgres keeps the base file's 5432:5432 mapping — reachable from the
#     internet, protected only by POSTGRES_PASSWORD below. This is a
#     deliberate choice (Drizzle Studio and psql from a local machine,
#     without an SSH tunnel) made explicitly aware that it widens the VPS's
#     attack surface to "whatever a strong password protects against" — see
#     scripts/generate-prod-secrets.ts for generating one, and
#     infrastructure/docker/README.md for the tradeoff and the safer
#     SSH-tunnel alternative.
#   - `api` stops publishing :4000 to the host — only Caddy and its own
#     compose-network peers need to reach it, and the base file's mapping
#     exists for local development.
#   - Real secrets come from infrastructure/docker/.env.prod (see
#     .env.prod.example), never the repo's dev .env.
#   - restart: unless-stopped, so a VPS reboot brings the stack back.
#   - Caddy added as the actual internet-facing edge: automatic HTTPS via
#     Let's Encrypt, reverse-proxying to `webserver` (see Caddyfile).
#
# Usage (from the repo root, on the VPS):
#   docker compose -f docker-compose.yml -f infrastructure/docker/docker-compose.prod.yml --profile app up -d --build
#
# Or use infrastructure/docker/deploy.sh, which wraps exactly this.

services:
  postgres:
    restart: unless-stopped
    env_file:
      - path: infrastructure/docker/.env.prod
        required: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    restart: unless-stopped
    ports: !override []

  api:
    restart: unless-stopped
    env_file: !override
      - path: infrastructure/docker/.env.prod
        required: true
    # The base file hardcodes DATABASE_URL/REDIS_URL/CDN_UPLOAD_ROOT here
    # for local dev convenience, and a service-level `environment:` always
    # wins over `env_file:` regardless of file order — so without clearing
    # it, .env.prod's real DATABASE_URL (with its real password) would be
    # silently shadowed by the dev "postgres:postgres" one above. Only
    # DATABASE_URL/REDIS_URL are meant to come from .env.prod though —
    # CDN_UPLOAD_ROOT is the same container-internal path in every
    # environment, so it's restated here rather than pushed into the
    # secrets file for no reason.
    environment: !override
      CDN_UPLOAD_ROOT: /cdn-media
    ports: !override []

  cdn:
    restart: unless-stopped
    ports: !override []

  # nginx (`web`) is the base file's other SPA front door, evaluated and not
  # used here — this deployment picked webserver (Go) for its per-page OG
  # tags and staff-gated source maps. A service needs *some* profile to be
  # excluded by --profile app (a service with none, or an empty list, always
  # runs regardless of --profile — Compose profiles are opt-in gates, not
  # exclusion filters) — "unused" isn't targeted by anything, so `up
  # --profile app` skips it. Switch back with `docker compose --profile app
  # --profile unused up -d`, or remove this override entirely.
  web:
    profiles: !override [unused]

  webserver:
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:4000
      ENV: production
    ports: !override []

  caddy:
    profiles: [app]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Relative paths in a compose file resolve against the *first* -f
      # file's directory (the repo root, for the invocation this project
      # uses), not this overlay's own directory — hence the full path
      # instead of ./Caddyfile.
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webserver
      # autodeploy is a sibling container now (see its own service below) —
      # reachable by service name like any other, same as webserver above.
      # Not strictly required for the ci.playani.me site block to resolve
      # it (Compose's embedded DNS resolves a defined service name even
      # before it reports healthy), but avoids a cold-start 502 on that
      # subdomain immediately after a fresh `up`.
      - autodeploy
      - cdn

  # autodeploy (services/autodeploy) — polls/webhook-triggers on new
  # commits and runs deploy.sh to redeploy the rest of this same stack.
  # Exists ONLY in this prod overlay, not the base file: the Docker socket
  # mount and the hardcoded host repo path below are meaningless (and
  # wrong) on a dev machine.
  #
  # Mounts the HOST's Docker socket so it can run `docker compose
  # build/up` against the host's own daemon from inside its own
  # container — the standard "Docker socket passthrough" pattern for a
  # containerized process that needs to manage sibling containers. This is
  # a deliberate, discussed tradeoff: anything that can reach this socket
  # has effectively host-root-equivalent access (see
  # infrastructure/docker/Dockerfile.autodeploy's own comment on why the
  # container runs as root rather than pretending to sandbox that away).
  #
  # The repo checkout is bind-mounted at the SAME absolute path it has on
  # the host (/root/playanime on both sides), not some other internal
  # path — required because the Docker DAEMON (not this container)
  # resolves every relative compose path (build context, bind-mount
  # sources) that deploy.sh's own `docker compose` invocation sends it,
  # against the host's real filesystem. A different internal path here
  # would make the CLI (running inside this container) compute paths the
  # host daemon can't correctly resolve. See
  # infrastructure/docker/Dockerfile.autodeploy's own comment for the
  # fuller version of this reasoning.
  autodeploy:
    profiles: [app]
    # Explicit stable tag rather than relying on Compose's own auto-naming
    # (project_service) — autodeploy.config.json's own "selfImage" field
    # (see config.Config.SelfImage) tells autodeploy how to launch a
    # detached sibling container of ITSELF to run deploy.sh in (see
    # deploy.StartDetached, and README.md's "Deploy-in-progress
    # coordination" section) — that launch goes through a plain `docker
    # run`, not Compose, so it needs a tag that exists independent of
    # Compose's own bookkeeping. Must match autodeploy.config.json's
    # "selfImage" value exactly.
    image: playanime-autodeploy:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.autodeploy
    restart: unless-stopped
    # Compose's command: REPLACES the image's CMD entirely rather than
    # appending to it — it does not merge with Dockerfile.autodeploy's own
    # CMD, so the binary itself has to be named again here too, or
    # ENTRYPOINT's tini ends up trying to exec "-config" as if it were the
    # program. /usr/local/bin/autodeploy (not a WORKDIR-relative
    # ./autodeploy) matters here too — see Dockerfile.autodeploy's own
    # comment on why the binary can't live under the bind-mounted repo
    # path below.
    command: ['/usr/local/bin/autodeploy', '-config', '/root/playanime/services/autodeploy/autodeploy.config.json']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/playanime:/root/playanime

  # dbgate — web-based Postgres browser at internal-db.playani.me (see
  # Caddyfile's own block and README.md's "Web-based database browser"
  # section). A SECOND, independent way to reach the database from the
  # internet alongside the already-open 5432 port (see README.md's
  # "Connecting Drizzle Studio" section) — not a replacement for it.
  # Gated by DBGATE_LOGIN/DBGATE_PASSWORD (the tool's own access control,
  # separate from POSTGRES_PASSWORD below) — anyone who reaches this UI
  # and guesses/leaks that password gets a full query interface, not just
  # a raw Postgres connection, so treat that password with the same care
  # as POSTGRES_PASSWORD itself.
  #
  # Every env var name below (CONNECTIONS/ENGINE_*/SERVER_*/etc.) was
  # confirmed against dbgate/dbgate's actual shipped server code, not
  # just its docs — including one real gotcha: the connection id
  # (playanime_postgres) MUST use an underscore, not a hyphen. A hyphen
  # in the id silently breaks Docker's own `-e NAME=value` env var
  # parsing (the flag is dropped entirely, no error), so DbGate would
  # boot with no configured connection and log a "missing ENGINE"
  # warning with no way for an end user to tell why.
  dbgate:
    profiles: [app]
    image: dbgate/dbgate:latest
    restart: unless-stopped
    environment:
      LOGIN: ${DBGATE_LOGIN}
      PASSWORD: ${DBGATE_PASSWORD}
      CONNECTIONS: playanime_postgres
      LABEL_playanime_postgres: PlayAnime Production
      ENGINE_playanime_postgres: postgres@dbgate-plugin-postgres
      SERVER_playanime_postgres: postgres
      PORT_playanime_postgres: 5432
      USER_playanime_postgres: postgres
      PASSWORD_playanime_postgres: ${POSTGRES_PASSWORD}
      DATABASE_playanime_postgres: playanime
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      - postgres

volumes:
  caddy_data:
  caddy_config:
  dbgate_data:
